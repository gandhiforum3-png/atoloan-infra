apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atoloan-ui-ingress
  namespace: atoloan-frontend
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
  - host: dev.atoloan.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: atoloan-ui
            port:
              number: 80
