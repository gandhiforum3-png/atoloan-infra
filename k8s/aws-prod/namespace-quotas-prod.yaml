# Resource quotas for prod: 2x t3.small = 4 vCPU / 4 GB RAM total.
# Steady state: 2 replicas. Limits sized for 3 pods to allow RollingUpdate surge (maxSurge=1).
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: backend-quota
  namespace: atoloan-backend-prod
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: frontend-quota
  namespace: atoloan-frontend-prod
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "5"
    services: "5"
    secrets: "10"
    configmaps: "10"
