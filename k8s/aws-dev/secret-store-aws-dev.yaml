apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
      auth:
        # EC2 IAM role (not IRSA) — credentials come from EC2 instance profile
        # No explicit auth needed when IAM role is attached to the EC2 instance
