# Reduced resource quotas for t3.small (2GB RAM total)
# Replaces the quotas in namespaces.yaml for the aws-dev environment
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: postgres-quota
  namespace: atoloan-postgres-dev
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "5"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: backend-quota
  namespace: atoloan-backend-dev
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: frontend-quota
  namespace: atoloan-frontend-dev
spec:
  hard:
    requests.cpu: "250m"
    requests.memory: 256Mi
    limits.cpu: "500m"
    limits.memory: 512Mi
    pods: "5"
    services: "5"
    secrets: "10"
    configmaps: "10"
