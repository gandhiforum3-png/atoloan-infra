apiVersion: v1
kind: Namespace
metadata:
  name: atoloan-postgres
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: postgres-quota
  namespace: atoloan-postgres
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "5"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: postgres-limits
  namespace: atoloan-postgres
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 100m
        memory: 128Mi
---
apiVersion: v1
kind: Namespace
metadata:
  name: atoloan-backend
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: backend-quota
  namespace: atoloan-backend
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    services: "10"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: backend-limits
  namespace: atoloan-backend
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi
---
