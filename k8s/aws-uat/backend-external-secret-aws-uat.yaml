# Pulls RDS connection details from AWS Secrets Manager (atoloan/postgres-uat).
# Terraform populates that secret automatically after RDS is created.
# The resulting k8s Secret is named `rds-secret` and is referenced by the
# backend Deployment as environment variables.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-secrets
  namespace: atoloan-backend-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: rds-secret
  data:
  - secretKey: PGUSER
    remoteRef: {key: atoloan/postgres-uat, property: PGUSER}
  - secretKey: PGPASSWORD
    remoteRef: {key: atoloan/postgres-uat, property: PGPASSWORD}
  - secretKey: PGDATABASE
    remoteRef: {key: atoloan/postgres-uat, property: PGDATABASE}
  - secretKey: PGHOST
    remoteRef: {key: atoloan/postgres-uat, property: PGHOST}
  - secretKey: PGPORT
    remoteRef: {key: atoloan/postgres-uat, property: PGPORT}

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atoloan-openai-secret
  namespace: atoloan-backend-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: atoloan-openai-secret
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: atoloan/openai
        property: OPENAI_API_KEY

