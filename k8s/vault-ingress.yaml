apiVersion: v1
kind: Namespace
metadata:
  name: atoloan-vault
---
# Points to Vault running on your Mac (outside the cluster)
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vault-external
  namespace: atoloan-vault
  labels:
    kubernetes.io/service-name: vault-external
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.65.254   # ← replace with your host.minikube.internal IP
ports:
  - port: 8200
---
# Service with no selector — uses the Endpoints above manually
apiVersion: v1
kind: Service
metadata:
  name: vault-external
  namespace: atoloan-vault
spec:
  ports:
    - port: 80
      targetPort: 8200
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-ingress
  namespace: atoloan-vault
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
  - host: dev.vault.atoloan.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vault-external
            port:
              number: 80
